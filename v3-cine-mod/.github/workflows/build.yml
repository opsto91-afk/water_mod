# Builds the LeviLauncher mod (.so for arm64-v8a + .levipack) on GitHub Actions.
#
#   Actions tab -> "build" -> Run workflow   (or just push to any branch)
#   -> download the "cinematic_mod-levipack" artifact
#   -> import dist/cinematic_mod.levipack in LeviLauncher
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y zip

      - name: Build the mod (arm64-v8a)
        run: |
          # The runner exports ANDROID_NDK_LATEST_HOME / ANDROID_SDK_ROOT, but those are
          # shell variables, not GitHub `env` context values - resolve the NDK here.
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::No Android NDK found on the runner"
            exit 1
          fi
          echo "Using NDK: $NDK"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_PLATFORM=android-26
          ./build.sh

      - name: Show what was built
        run: |
          ls -lh dist/ dist/cinematic_mod/
          file dist/cinematic_mod/libcinematic_mod.so
          unzip -l dist/cinematic_mod.levipack

      - uses: actions/upload-artifact@v4
        with:
          name: cinematic_mod-levipack
          path: |
            dist/cinematic_mod.levipack
            dist/cinematic_mod/libcinematic_mod.so
            dist/cinematic_mod/manifest.json
          if-no-files-found: error
          retention-days: 90

  host-test:
    name: Host-side UI/engine tests (no phone needed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make -C tests run
