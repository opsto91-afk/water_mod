name: Screen POV Build

# NOTE (2026-11-11): at the user's request this workflow now builds ONLY the Screen POV mod.
# The Water Tweaks / Infinite Flow / V4 Cine Mod jobs were removed - their source and history
# remain in this repository (see git log); re-add them if ever needed.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pov-mod:
    name: Build Screen POV mod (from pov_mod/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zip
      - name: Run pov_mod core tests
        run: make -C pov_mod/tests run
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"
      - name: Configure NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build pov_mod.levipack
        run: cd pov_mod && bash ./build.sh
      - name: Upload Screen POV package
        uses: actions/upload-artifact@v4
        with:
          name: screen_pov
          path: pov_mod/dist/pov_mod.levipack
          if-no-files-found: error
