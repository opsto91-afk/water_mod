name: Cine Mod Build

on:
  push:
    paths:
      - 'v3-cine-mod/**'
      - '.github/workflows/cine-mod.yml'
  pull_request:
    paths:
      - 'v3-cine-mod/**'
      - '.github/workflows/cine-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Cine Mod host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C v3-cine-mod/tests run

  android:
    name: Build arm64 LeviLauncher package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zip
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'
      - name: Build cinematic_mod.levipack
        working-directory: v3-cine-mod
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build.sh
          unzip -l dist/cinematic_mod.levipack
      - name: Upload LeviLauncher package
        uses: actions/upload-artifact@v4
        with:
          name: cinematic_mod-levipack
          path: |
            v3-cine-mod/dist/cinematic_mod.levipack
            v3-cine-mod/dist/cinematic_mod/libcinematic_mod.so
            v3-cine-mod/dist/cinematic_mod/manifest.json
          if-no-files-found: error
