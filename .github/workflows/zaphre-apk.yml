name: ZaphRE APK Build

on:
  workflow_dispatch:
    inputs:
      source_bundle:
        description: "Package ZaphRE v3 source and runtime dependencies only"
        type: boolean
        default: true
      build_only:
        description: "Build APK without running automated tests"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  native-host-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.build_only || inputs.source_bundle)) }}
    name: C++17 ELF Analyzer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile & run C++17 ELF analyzer unit tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            zaphre/app/src/main/cpp/elf_analyzer.cpp \
            zaphre/tests/test_elf_analyzer.cpp \
            -o /tmp/test_elf_analyzer
          /tmp/test_elf_analyzer

  build-apk:
    name: Build ZaphRE arm64-v8a APK (Levi v1.7.1 Runtime)
    needs: native-host-tests
    if: ${{ always() && !inputs.source_bundle && (needs.native-host-tests.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_only && needs.native-host-tests.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official LeviLauncher v1.7.1 arm64-v8a runtime libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/levi_release zaphre/app/src/main/jniLibs/arm64-v8a
          gh release download v1.7.1 \
            --repo LiteLDev/LeviLauncher-Android \
            --pattern "LeviLauncher-v1.7.1-release.apk" \
            --dir /tmp/levi_release \
            --clobber
          unzip -o -j /tmp/levi_release/LeviLauncher-v1.7.1-release.apk \
            "lib/arm64-v8a/libPlayFabMultiplayer.so" \
            "lib/arm64-v8a/libmaesdk.so" \
            "lib/arm64-v8a/libHttpClient.Android.so" \
            "lib/arm64-v8a/libpreloader.so" \
            -d zaphre/app/src/main/jniLibs/arm64-v8a/
          ls -lh zaphre/app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & NDK 27
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare stable release signing
        env:
          PETA_KEYSTORE_B64: ${{ secrets.PETA_KEYSTORE_B64 }}
          PETA_KEYSTORE_PASSWORD: ${{ secrets.PETA_KEYSTORE_PASSWORD }}
          PETA_KEY_ALIAS: ${{ secrets.PETA_KEY_ALIAS }}
          PETA_KEY_PASSWORD: ${{ secrets.PETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PETA_KEYSTORE_B64:-}" ] || [ -z "${PETA_KEYSTORE_PASSWORD:-}" ] || [ -z "${PETA_KEY_ALIAS:-}" ] || [ -z "${PETA_KEY_PASSWORD:-}" ]; then
            echo "::error::Stable release signing is not configured. Add the PETA signing secrets in repository settings."
            exit 1
          fi
          printf '%s' "$PETA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/peta-release.jks"
          chmod 600 "$RUNNER_TEMP/peta-release.jks"
          {
            echo "PETA_KEYSTORE_PATH=$RUNNER_TEMP/peta-release.jks"
            echo "PETA_KEYSTORE_PASSWORD=$PETA_KEYSTORE_PASSWORD"
            echo "PETA_KEY_ALIAS=$PETA_KEY_ALIAS"
            echo "PETA_KEY_PASSWORD=$PETA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run Kotlin Unit Tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        working-directory: zaphre
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Signed Installable ZaphRE APK (arm64-v8a)
        working-directory: zaphre
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/zaphre-build.log"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PETA-V93-arm64.apk
          echo "=== Verified native libraries inside PETA-V93-arm64.apk ==="
          unzip -l dist/PETA-V93-arm64.apk "lib/arm64-v8a/*"
          ls -lh dist/PETA-V93-arm64.apk

      - name: Show release certificate fingerprint
        working-directory: zaphre
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/PETA-V93-arm64.apk'

      - name: Report build failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'zaphre-build.log')
          if os.path.exists(path):
              lines = open(path, errors='replace').readlines()
              selected = [line for i,line in enumerate(lines) if any(x in line.lower() for x in ['error:', 'what went wrong', 'failed:', 'fatal error', 'cmake error', 'could not', 'failure:'])]
              text = ''.join(selected[-30:]) or ''.join(lines[-80:])
              print('::error::' + text[-8000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY

      - name: Upload ZaphRE APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PETA-V93-arm64
          path: zaphre/dist/PETA-V93-arm64.apk
          if-no-files-found: error

      # Manual builds have unique tags so an old APK can never be mistaken for this build.
      - name: Publish Direct-Download APK on GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="peta-v93-build-${GITHUB_SHA:0:8}"
          APK="zaphre/dist/PETA-V93-arm64.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping the original asset."
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "PETA V93 build ${GITHUB_SHA:0:8}" \
              --notes "Arm64 side-by-side build. Built without automated tests at user request. Separate package; automatic v3 private-data migration is not available. Job recovery and media/provider support have platform limits."
          fi

  v3-source-bundle:
    name: Package ZaphRE v3 source and native dependencies
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_bundle }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact v3 source commit
        uses: actions/checkout@v4
        with:
          ref: ef89cb22aa622d6f0de36c5bc313e9cb90317fbc
      - name: Assemble source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ZaphRE-v3-complete"
          mkdir -p "$ROOT" "$RUNNER_TEMP/downloads"
          cp -a zaphre/. "$ROOT/"
          mkdir -p "$ROOT/vendor/llama.cpp" "$ROOT/app/src/main/jniLibs/arm64-v8a" "$ROOT/build-support"
          cp .github/workflows/zaphre-apk.yml "$ROOT/build-support/original-v3-ci.yml"
          curl -fL --retry 3 -o "$RUNNER_TEMP/downloads/llama.tar.gz" https://codeload.github.com/ggml-org/llama.cpp/tar.gz/6f5c9ad21746f69bbb7f3cb295a90e53fe316963
          tar -xzf "$RUNNER_TEMP/downloads/llama.tar.gz" --strip-components=1 -C "$ROOT/vendor/llama.cpp"
          gh release download v1.7.1 --repo LiteLDev/LeviLauncher-Android --pattern 'LeviLauncher-v1.7.1-release.apk' --dir "$RUNNER_TEMP/downloads"
          unzip -o -j "$RUNNER_TEMP/downloads/LeviLauncher-v1.7.1-release.apk" 'lib/arm64-v8a/libPlayFabMultiplayer.so' 'lib/arm64-v8a/libmaesdk.so' 'lib/arm64-v8a/libHttpClient.Android.so' 'lib/arm64-v8a/libpreloader.so' -d "$ROOT/app/src/main/jniLibs/arm64-v8a"
          python3 - "$ROOT" <<'PYCODE'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          cmake = root / 'app/src/main/cpp/CMakeLists.txt'
          s = cmake.read_text()
          before = 'FetchContent_Declare(llama_cpp URL https://codeload.github.com/ggml-org/llama.cpp/tar.gz/6f5c9ad21746f69bbb7f3cb295a90e53fe316963)\nFetchContent_MakeAvailable(llama_cpp)'
          after = 'set(llama_cpp_SOURCE_DIR "${CMAKE_CURRENT_LIST_DIR}/../../../../vendor/llama.cpp")\nadd_subdirectory("${llama_cpp_SOURCE_DIR}" "${CMAKE_BINARY_DIR}/llama_cpp")'
          if before not in s: raise SystemExit('Unexpected v3 CMake file')
          cmake.write_text(s.replace(before, after))
          (root / 'BUNDLE-INFO.txt').write_text("""ZaphRE v3 source + bundled native dependencies
          ZaphRE source commit: ef89cb22aa622d6f0de36c5bc313e9cb90317fbc (org.levimc.zaphr3, v3.0.0).
          Includes the full pinned llama.cpp source at vendor/llama.cpp, commit 6f5c9ad21746f69bbb7f3cb295a90e53fe316963, including its license.
          Includes the four arm64 runtime libraries extracted unmodified from the official LeviLauncher Android v1.7.1 release APK.
          The CMake file is modified solely to use the bundled llama.cpp source instead of fetching it.
          Original v3 GitHub Actions instructions are in build-support/original-v3-ci.yml.
          This is not the compiled ZaphRE APK and contains no GGUF models, Minecraft libraries, libZaphkiel.so, chats or keys.
          Android SDK platform 35, build-tools 35.0.0, NDK 27.2.12479018, CMake 3.22.1, JDK 21 and Gradle 8.11.1 are not bundled; Gradle and Android libraries may require network access. See README.md.
          Third-party components retain their original licenses and terms.
          """)
          PYCODE
          cd "$RUNNER_TEMP"
          zip -qr ZaphRE-v3-source-with-dependencies.zip ZaphRE-v3-complete
          ls -lh ZaphRE-v3-source-with-dependencies.zip
      - name: Upload downloadable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=zaphre-v3-source-bundle
          ASSET="$RUNNER_TEMP/ZaphRE-v3-source-with-dependencies.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --target ef89cb22aa622d6f0de36c5bc313e9cb90317fbc --title 'ZaphRE v3 source with dependencies' --notes 'v3 source, pinned llama.cpp source, and the four LeviLauncher v1.7.1 arm64 runtime libraries. Android SDK, JDK, Gradle dependencies, GGUF models and Minecraft are not bundled.'
          fi
